name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: cd apps/api && ruff check app tests scripts && ruff format --check app tests scripts
      - name: Tests
        run: cd apps/api && PYTHONPATH=. pytest -q
      - name: Counterfactual — the second call must not be scripted
        run: cd apps/api && PYTHONPATH=. python scripts/counterfactual.py
      - name: Reliability gate — 5 consecutive flagship runs
        run: cd apps/api && PYTHONPATH=. python scripts/reliability_gate.py
      - name: Migrations apply from empty
        run: cd apps/api && DATABASE_URL="sqlite+aiosqlite:///./ci.db" alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
